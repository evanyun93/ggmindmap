<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- 치명적 오류 감시 (Inline) -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var displayMsg = msg + '\nAt: ' + (url || 'unknown') + ':' + lineNo + ':' + columnNo;
      var ua = navigator.userAgent || "";
      var isWebView = /KAKAOTALK|FB_IAB|FBAN|FBAV|Instagram|Line|NAVER|Daum/i.test(ua) || (/(iPhone|iPad|iPod)/i.test(ua) && !/Safari/i.test(ua));

      if (window.showFatalError) {
          window.showFatalError(displayMsg);
      } else {
          var div = document.createElement('div');
          div.id = 'fatal-error-overlay';
          div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);color:white;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;text-align:center;animation:fadeInError 0.5s ease-out;';
          
          window.toggleErrorLogs = function(el) {
              var pre = document.getElementById('error-pre-log');
              pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
              el.textContent = pre.style.display === 'none' ? '기술적 상세 내용 보기 ▼' : '상세 내용 접기 ▲';
          };

          window.forceExternalBrowser = function() {
              var url = "https://ggmindmap.vercel.app";
              if (document.getElementById('manual-guide-overlay')) return;
              var overlay = document.createElement('div');
              overlay.id = 'manual-guide-overlay';
              overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.9);z-index:100000000;display:flex;flex-direction:column;align-items:flex-end;padding:20px;color:white;font-weight:bold;text-align:right;backdrop-filter:blur(10px);';
              overlay.innerHTML = '<div style="font-size:40px;margin-bottom:10px;animation:errorBounce 1.5s infinite;">↗️</div><div style="font-size:20px;line-height:1.4;">여기 메뉴 버튼을 눌러<br><span style="color:#a78bfa;">[다른 브라우저로 열기]</span>를<br>선택해 주세요!</div><button onclick="this.parentElement.remove()" style="margin-top:40px;background:white;color:black;border:none;padding:12px 24px;border-radius:12px;font-weight:bold;cursor:pointer;">안내 닫기</button><style>@keyframes errorBounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-15px); } }</style>';
              document.body.appendChild(overlay);

              var isIOS = /iPhone|iPad|iPod/i.test(ua);
              var isAndroid = /Android/i.test(ua);
              if (/KAKAOTALK/i.test(ua)) {
                  setTimeout(function() { window.location.href = 'kakaotalk://web/openExternalApp?url=' + encodeURIComponent(url); }, 100);
                  if (isIOS) setTimeout(function() { window.location.href = 'kakaoweb://openExternalApp?url=' + encodeURIComponent(url); }, 500);
              }
              if (isAndroid) {
                  var intentUrl = 'intent://' + url.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
                  setTimeout(function() { window.location.href = intentUrl; }, 300);
              }
              setTimeout(function() { window.location.href = url; }, 1000);
          };

          var contentHtml = '<div style="background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:32px;padding:40px;max-width:450px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,0.5);">' +
              '<div style="font-size:64px;margin-bottom:20px;">🚀</div>' +
              '<h2 style="font-size:26px;margin-bottom:12px;font-weight:700;color:#f8fafc;letter-spacing:-0.5px;">최상의 환경으로 안내합니다</h2>' +
              '<p style="margin-bottom:30px;color:#94a3b8;line-height:1.6;font-size:15px;">' + (isWebView ? '현재 인앱 브라우저는 성능이 제한되어 있습니다.<br>더 쾌적한 전용 앱이나 공식 브라우저를 열어드릴까요?' : '서비스 초기화 중 환경 설정이 필요합니다.<br>잠시 후 다시 시도해 주세요.') + '</p>' +
              '<div style="display:flex;flex-direction:column;gap:12px;">' +
              (isWebView ? '<button onclick="window.forceExternalBrowser()" style="padding:16px 24px;background:#8b5cf6;color:white;border:none;border-radius:16px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 20px rgba(139,92,246,0.3);transition:all 0.3s;">외부 브라우저로 열기 (추천)</button>' : '') +
              '<button onclick="window.location.reload()" style="padding:14px 24px;background:rgba(255,255,255,0.05);color:#cbd5e1;border:1px solid rgba(255,255,255,0.1);border-radius:16px;font-weight:600;font-size:14px;cursor:pointer;">현재 페이지 새로고침</button>' +
              '</div>' +
              '<div onclick="window.toggleErrorLogs(this)" style="margin-top:40px;color:rgba(255,255,255,0.3);font-size:12px;cursor:pointer;text-decoration:underline;">기술적 상세 내용 보기 ▼</div>' +
              '<pre id="error-pre-log" style="display:none;margin-top:20px;width:100%;background:rgba(0,0,0,0.3);padding:15px;border-radius:12px;font-size:11px;color:#94a3b8;white-space:pre-wrap;word-break:break-all;text-align:left;border:1px solid rgba(255,255,255,0.05);">' + displayMsg + '</pre>' +
              '</div>' +
              '<style>@keyframes fadeInError { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }</style>';

          div.innerHTML = contentHtml;
          document.body ? document.body.appendChild(div) : window.addEventListener('DOMContentLoaded', function() { document.body.appendChild(div); });
      }
      return false;
    };
    window.onunhandledrejection = function(event) {
      if (window.showFatalError) window.showFatalError('Promise Error: ' + event.reason);
    };
    window.onunhandledrejection = function(event) {
      if (window.showFatalError) window.showFatalError('Promise Error: ' + event.reason);
    };
  </script>
  <meta name="description" content="나만의 마인드맵 - 생각을 시각화하세요">
  <meta name="color-scheme" content="light dark">
  <title>MindMap - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/css/dashboard-layout.css">
  <link rel="icon" type="image/png" href="assets/advanced-icon.png" />
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="성연MindMap">
  <link rel="apple-touch-icon" href="assets/advanced-icon.png">
  <meta name="theme-color" content="#8b5cf6">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div id="app-root">
    <!-- 배경 애니메이션 파티클 -->
    <div class="bg-particles" id="particles"></div>

    <!-- 메인 컨테이너 (인증 대기 중 로그인 화면 깜빡임 방지를 위해 기본 숨김) -->
    <div class="auth-container" id="authContainer" style="display: none;">
      
      <!-- 인앱 브라우저 전용 안내 배너 (웹뷰 감재 시 활성화) -->
      <div id="inAppBrowserBanner" style="display: none; background: rgba(139, 92, 246, 0.15); border: 2px solid rgba(139, 92, 246, 0.4); border-radius: 12px; margin: 0 10px 20px 10px; padding: 15px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: slideDown 0.5s ease-out; width: auto; max-width: 440px; align-self: center;">
          <div style="display: flex; align-items: flex-start; gap: 12px; text-align: left;">
              <span style="font-size: 24px;">🌐</span>
              <div style="flex: 1;">
                  <h4 style="margin: 0 0 4px 0; color: #8b5cf6; font-size: 15px;">이 환경에서는 앱 설치가 어렵습니다</h4>
                  <p style="margin: 0; color: #495057; font-size: 13px; line-height: 1.4;">기능 제약이 없는 <b>일반 브라우저(Chrome/Safari)</b>로 이동하여 더 편하게 사용하고 앱으로 설치해 보세요!</p>
                  <button id="openExternalBrowserBtn" style="margin-top: 12px; width: 100%; padding: 10px; background: #8b5cf6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);">
                      외부 브라우저에서 열기
                  </button>
              </div>
          </div>
      </div>

      <!-- ═══ 로그인 폼 ═══ -->
      <div class="auth-card" id="loginCard">
        <div class="auth-header">
          <div class="logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="8" fill="url(#grad1)" />
              <circle cx="24" cy="8" r="4" fill="url(#grad2)" />
              <circle cx="38" cy="16" r="4" fill="url(#grad2)" />
              <circle cx="38" cy="32" r="4" fill="url(#grad2)" />
              <circle cx="24" cy="40" r="4" fill="url(#grad2)" />
              <circle cx="10" cy="32" r="4" fill="url(#grad2)" />
              <circle cx="10" cy="16" r="4" fill="url(#grad2)" />
              <line x1="24" y1="16" x2="24" y2="8" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="30" y1="19" x2="38" y2="16" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="30" y1="29" x2="38" y2="32" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="24" y1="32" x2="24" y2="40" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="18" y1="29" x2="10" y2="32" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="18" y1="19" x2="10" y2="16" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <defs>
                <linearGradient id="grad1" x1="16" y1="16" x2="32" y2="32">
                  <stop stop-color="#8B5CF6" />
                  <stop offset="1" stop-color="#06B6D4" />
                </linearGradient>
                <linearGradient id="grad2" x1="0" y1="0" x2="48" y2="48">
                  <stop stop-color="#A78BFA" />
                  <stop offset="1" stop-color="#22D3EE" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1>성연's MindMap</h1>
          <p class="subtitle">생각을 시각화하세요</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="input-group">
            <label for="loginUsername">아이디</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input type="text" id="loginUsername" placeholder="아이디를 입력하세요" autocomplete="username" required>
            </div>
          </div>

          <div class="input-group">
            <label for="loginPassword">비밀번호</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="loginPassword" placeholder="비밀번호를 입력하세요" autocomplete="current-password"
                required>
            </div>
          </div>

          <div class="remember-me">
            <label class="checkbox-container">
              <input type="checkbox" id="rememberMe">
              <span class="checkmark"></span>
              <span class="checkbox-label">이 PC에서 기억하기</span>
            </label>
          </div>

          <div class="error-message" id="loginError"></div>

          <button type="submit" class="btn-primary" id="loginBtn">
            <span class="btn-text">로그인</span>
            <span class="btn-loading" style="display:none;">
              <svg class="spinner" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"
                  stroke-dasharray="31.4 31.4" stroke-linecap="round" />
              </svg>
            </span>
          </button>

          <!-- ═══ 소셜 로그인 섹션 ═══ -->
          <div class="social-login-divider">
            <span>또는 간편 로그인</span>
          </div>

          <div class="social-login-group">
            <button type="button" class="btn-social kakao" id="kakaoLoginBtn">
              <div class="social-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.558 1.707 4.8 4.27 6.054-.188.702-.682 2.545-.78 2.922-.123.477.175.47.37.34.15-.1.2.4-.2.24 1.888-1.282 2.684-1.82 3.76-2.546.45.066.913.1 1.38.1 4.97 0 9-3.186 9-7.115S16.97 3 12 3z" />
                </svg>
              </div>
              <span>카카오 로그인</span>
            </button>
            <button type="button" class="btn-social naver" id="naverLoginBtn">
              <div class="social-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155l8.897 12.845H24V0h-7.727v12.845z" />
                </svg>
              </div>
              <span>네이버 로그인</span>
            </button>
            <button type="button" class="btn-social google" id="googleLoginBtn">
              <div class="social-icon">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4" />
                  <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853" />
                  <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                    fill="#FBBC05" />
                  <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335" />
                </svg>
              </div>
              <span>Google 로그인</span>
            </button>
          </div>
        </form>

        <div class="auth-footer">
          <p>계정이 없으신가요? <button class="link-btn" id="showRegister">회원가입</button></p>
          <button id="authInstallApp"
            style="display: none; width: 100%; margin-top: 20px; padding: 12px; background: #8B5CF6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s;"
            onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
            <span>📱 MindMap 앱 설치 (알림 지원)</span>
          </button>
        </div>
      </div>

      <!-- ═══ 회원가입 폼 ═══ -->
      <div class="auth-card hidden" id="registerCard">
        <div class="auth-header">
          <div class="logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="8" fill="url(#grad1)" />
              <circle cx="24" cy="8" r="4" fill="url(#grad2)" />
              <circle cx="38" cy="16" r="4" fill="url(#grad2)" />
              <circle cx="38" cy="32" r="4" fill="url(#grad2)" />
              <circle cx="24" cy="40" r="4" fill="url(#grad2)" />
              <circle cx="10" cy="32" r="4" fill="url(#grad2)" />
              <circle cx="10" cy="16" r="4" fill="url(#grad2)" />
              <line x1="24" y1="16" x2="24" y2="8" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="30" y1="19" x2="38" y2="16" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="30" y1="29" x2="38" y2="32" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="24" y1="32" x2="24" y2="40" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="18" y1="29" x2="10" y2="32" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
              <line x1="18" y1="19" x2="10" y2="16" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
            </svg>
          </div>
          <h1>회원가입</h1>
          <p class="subtitle">새 계정을 만들어보세요</p>
        </div>

        <form id="registerForm" class="auth-form">
          <div class="input-group">
            <label for="regUsername">아이디</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input type="text" id="regUsername" placeholder="3자 이상" autocomplete="username" required minlength="3">
            </div>
          </div>

          <div class="input-group">
            <label for="regPassword">비밀번호</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="regPassword" placeholder="4자 이상" autocomplete="new-password" required
                minlength="4">
            </div>
          </div>

          <div class="input-group">
            <label for="regDisplayName">닉네임 <span class="optional"></span></label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
              </svg>
              <input type="text" id="regDisplayName" placeholder="표시될 이름" autocomplete="name" required>
            </div>
          </div>

          <div class="input-group" id="emailInputGroup">
            <label for="regEmail">이메일 <span class="optional">(선택)</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <input type="email" id="regEmail" placeholder="이메일 주소" autocomplete="email">
            </div>
          </div>

          <div class="error-message" id="registerError"></div>
          <div class="success-message" id="registerSuccess"></div>

          <button type="submit" class="btn-primary" id="registerBtn">
            <span class="btn-text">가입하기</span>
            <span class="btn-loading" style="display:none;">
              <svg class="spinner" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"
                  stroke-dasharray="31.4 31.4" stroke-linecap="round" />
              </svg>
            </span>
          </button>
        </form>

        <div class="auth-footer">
          <p>이미 계정이 있으신가요? <button class="link-btn" id="showLogin">로그인</button></p>
        </div>
      </div>

    </div> <!-- closes authContainer -->
  </div> <!-- #app-root END -->

  <!-- 전역 고정 푸터 -->
  <footer class="app-footer-fixed">
    <div class="footer-content">
      <span id="networkStatusDot" class="network-status-dot" title="네트워크 상태 확인 중..."></span>
      <button class="app-version-btn" id="footerVersion" title="업데이트 내역 확인">Version 2.0.0</button>
      <span class="divider">|</span>
      <span class="app-credit">만든이 :
        <a href="https://www.instagram.com/yun.boy" target="_blank" class="insta-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="url(#instaGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
